[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spec-harvester"
version = "0.2.0"
description = "AI-assisted candidate SpecPackage harvesting pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "0AL Spec" },
  { name = "Egor Merkushev" }
]
dependencies = [
  "jsonschema>=4.0",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pylint>=3.3,<4",
  "ruff>=0.4"
]

[project.scripts]
spec-harvester = "spec_harvester.cli:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/local-candidate-review-workbench-v0.schema.json" = "spec_harvester/schemas/local-candidate-review-workbench-v0.schema.json"
"schemas/ai-semantic-author-v0.schema.json" = "spec_harvester/schemas/ai-semantic-author-v0.schema.json"
"tests/fixtures/semantic_author_quality_policy/p55-t5-semantic-quality-thresholds.example.json" = "spec_harvester/policies/semantic-author-quality-thresholds-v0.json"
