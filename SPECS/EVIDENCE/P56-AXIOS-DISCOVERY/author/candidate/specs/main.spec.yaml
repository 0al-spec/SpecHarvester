    kind: documentation
    path: evidence/promise-runtime.md
    supports:
      - constraints.promise_runtime
  - id: source_manifest
    kind: documentation
    path: evidence/sources.json
    supports:
      - provenance.sourceConfidence
  - id: package_metadata
    kind: package_manifest
    path: evidence/package-metadata.txt
    supports:
      - intent.summary
      - scope
      - provenance.sourceConfidence
  - id: feature_overview
    kind: documentation
    path: evidence/features.md
    supports:
      - intent.summary
      - scope.includes
      - provides.capabilities.axios.http_client.serialize_transform
      - provides.capabilities.axios.http_client.control
  - id: public_config_types
    kind: source
    path: evidence/public-config-types.ts
    supports:
      - scope.includes
      - provides.capabilities.axios.http_client.configure
      - provides.capabilities.axios.http_client.authenticate_protect
      - provides.capabilities.axios.http_client.control
      - provides.capabilities.axios.http_client.adapt_transport
      - interfaces.inbound.request_api
      - constraints.runtime_qualified_transport
  - id: public_request_api
    kind: source
    path: evidence/public-request-api.ts
    supports:
      - provides.capabilities.axios.http_client.request
      - provides.capabilities.axios.http_client.configure
      - interfaces.inbound.request_api
      - interfaces.inbound.instance_factory
  - id: request_config_core
    kind: documentation
    path: evidence/request-config-core.md
    supports:
      - provides.capabilities.axios.http_client.configure
      - provides.capabilities.axios.http_client.serialize_transform
      - interfaces.inbound.request_api
      - constraints.base_url_not_security_boundary
      - constraints.body_and_decompression_limits
  - id: request_data_auth
    kind: documentation
    path: evidence/request-data-auth.md
    supports:
      - provides.capabilities.axios.http_client.serialize_transform
      - provides.capabilities.axios.http_client.authenticate_protect
      - interfaces.inbound.request_api
      - constraints.credential_disclosure
      - constraints.formdata_header_policy
      - effects.sideEffects.outbound_request_data
      - effects.sideEffects.remote_mutation_request
  - id: request_security_limits
    kind: documentation
    path: evidence/request-security-limits.md
    supports:
      - provides.capabilities.axios.http_client.authenticate_protect
      - provides.capabilities.axios.http_client.control
      - constraints.xsrf_credentials_independent
      - constraints.body_and_decompression_limits
      - effects.sideEffects.outbound_request_data
  - id: configured_instances
    kind: documentation
    path: evidence/instances.md
    supports:
      - provides.capabilities.axios.http_client.configure
      - interfaces.inbound.instance_factory
      - effects.sideEffects.client_configuration_state
  - id: multipart_serialization
    kind: documentation
    path: evidence/multipart.md
    supports:
      - provides.capabilities.axios.http_client.serialize_transform
      - constraints.formdata_header_policy
      - constraints.body_and_decompression_limits
  - id: authentication_patterns
    kind: documentation
    path: evidence/authentication.md
    supports:
      - provides.capabilities.axios.http_client.authenticate_protect
      - constraints.credential_disclosure
      - effects.sideEffects.outbound_request_data
  - id: interceptor_behavior
    kind: documentation
    path: evidence/interceptors.md
    supports:
