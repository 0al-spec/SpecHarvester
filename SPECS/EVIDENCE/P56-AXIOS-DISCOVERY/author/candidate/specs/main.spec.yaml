apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: axios.http_client
  title: Axios HTTP Client Library
  version: 1.19.0
  status: draft
intent:
  summary: Let JavaScript and TypeScript application developers call HTTP APIs from browser or Node.js code with reusable service configuration, common payload encoding, request/response policy hooks, bounded transfer controls, and structured response or failure inspection.
scope:
  boundedContext: public_axios_http_client_api
  includes:
    - The default callable Axios export, HTTP method aliases, and Axios instances created with axios.create.
    - Request URL, method, query, headers, credentials, body, transformation, response-type, timeout, cancellation, status-validation, progress, size-limit and adapter configuration.
    - JSON, URL-encoded and multipart/FormData request preparation, with environment-specific body and header qualifiers.
    - Request and response interceptors, typed response/error surfaces, built-in XHR, Node.js HTTP and fetch adapters, custom adapter selection, Node.js bandwidth limits, and experimental Node.js HTTP/2 configuration.
    - Source-described behavior at the pinned Axios 1.19.0 revision; no request was executed.
  excludes:
    - A standalone command-line client, HTTP server, service discovery layer, API schema client generator, or remote service implementation.
    - A built-in retry, backoff, token-refresh or cache policy. Reviewed retry and refresh guidance composes application interceptors; cache behavior was not established in the bounded review.
    - Guarantees about remote mutation success, remote storage, logging, retention, availability, performance, security, or acceptance by an endpoint.
    - Exhaustive proxy, redirect, Unix-socket, decompression-codec, header-helper, browser-version and every exported-helper behavior.
    - Runtime conformance, package publication, canonical intent assignment, or acceptance of this preview.
provides:
  capabilities:
    - id: axios.http_client.request
      role: primary
      summary: Issue Promise-based HTTP requests through a config object or GET, DELETE, HEAD, OPTIONS, POST, PUT, PATCH and form aliases, with the URL, method, query, headers and optional body supplied by the caller.
    - id: axios.http_client.configure
      role: supporting
      summary: Create isolated clients with reusable baseURL, headers, authentication, timeout and other defaults, then override merged configuration per request.
    - id: axios.http_client.serialize_transform
      role: supporting
      summary: Serialize query parameters and JSON, URL-encoded or multipart/FormData bodies, and run request/response transforms; supported body types and multipart header handling vary by runtime.
    - id: axios.http_client.authenticate_protect
      role: supporting
      summary: Attach custom authorization or API-key headers, HTTP Basic credentials, browser cross-site credentials and configurable XSRF headers while keeping each disclosure conditional on request and runtime configuration.
    - id: axios.http_client.intercept
      role: supporting
      summary: Register, conditionally run, eject or clear request and response interceptors for shared application policy; request order is LIFO and response order is FIFO.
    - id: axios.http_client.control
      role: supporting
      summary: Cancel with AbortSignal, enforce timeouts, customize accepted HTTP statuses, cap request/response sizes where supported, observe transfer progress, and limit Node.js HTTP-adapter bandwidth.
    - id: axios.http_client.inspect_outcome
      role: supporting
      summary: Inspect response data, status, normalized headers, request config and transport object, or distinguish Axios HTTP, network, timeout, cancellation, setup and unsupported-feature failures.
    - id: axios.http_client.adapt_transport
      role: supporting
      summary: Select XHR, Node.js HTTP or fetch transport by name or environment priority, supply a custom adapter, and opt into experimental Node.js HTTP/2 with its redirect limitation.
requires:
  capabilities: []
interfaces:
  inbound:
    - id: request_api
      kind: library
      summary: Call axios(config), axios(url, config), an HTTP method alias, or the equivalent AxiosInstance method. Input can include URL/method, query params and serializer, headers/auth, body, transforms, timeout/signal, responseType, validateStatus, progress callbacks, limits and adapter selection; the exact valid options are adapter- and runtime-qualified.
    - id: instance_factory
      kind: library
      summary: Call axios.create(config) to obtain a callable AxiosInstance with service defaults and isolated interceptors; request configuration overrides instance defaults, which override library defaults.
    - id: interceptor_api
      kind: library
      summary: Register fulfilled/rejected request or response handlers through instance.interceptors, optionally mark request handlers synchronous or guard them with runWhen, and remove one handler with eject or all handlers with clear.
    - id: adapter_api
      kind: plugin
      summary: Select xhr, http or fetch adapters, an ordered fallback list, or a custom function that accepts merged/transformed config and returns a Promise for an Axios-shaped response. A custom adapter controls the actual transport and can change the effects declared for built-in adapters.
  outbound:
    - id: response_promise
      kind: library
      summary: Resolve with response data, status, statusText, normalized response headers, effective config and the underlying request; response transforms run before consumers receive the result.
    - id: error_rejection
      kind: library
      summary: Reject with AxiosError or CanceledError carrying a code and available config/request/response context. By default non-2xx statuses reject; validateStatus changes that policy, and redact masks selected config fields only when serializing an error.
    - id: progress_callbacks
      kind: event
      summary: Invoke configured upload/download callbacks with loaded bytes and, when known, total, progress, delta bytes, estimated time and rate; documented callback frequency is capped at three per second.
constraints:
  - id: promise_runtime
    level: MUST
    statement: Consumers must provide native ES6 Promise support or a compatible polyfill, as required by the pinned Axios documentation.
  - id: runtime_qualified_transport
    level: MUST
    statement: Consumers must select only an adapter and option set supported by their runtime; XHR, Node.js HTTP and fetch behavior is not identical, and a custom adapter defines its own transport behavior.
  - id: base_url_not_security_boundary
    level: MUST
    statement: Consumers must validate untrusted request URLs; baseURL and allowAbsoluteUrls construct URLs but do not constrain relative path traversal or establish an origin security boundary.
  - id: credential_disclosure
    level: MUST
    statement: Consumers must treat configured headers, Basic auth, URL credentials, cookies, API keys and XSRF tokens as outbound data to the request destination and enable them only under intended origin and credential conditions.
  - id: xsrf_credentials_independent
    level: MUST
    statement: Browser withCredentials and withXSRFToken control separate behaviors; cross-origin requests need withXSRFToken true to force the XSRF header and withCredentials true only when cookies or other browser credentials are also required.
  - id: body_and_decompression_limits
    level: SHOULD
    statement: Consumers calling untrusted servers should set maxContentLength to bound response size, including the decompressed response that can otherwise exhaust a Node.js process. Separately, maxBodyLength bounds the outgoing request body. Their documented defaults are unlimited; enforcement varies by adapter and determinable length.
  - id: formdata_header_policy
    level: SHOULD
    statement: Browser-like runtimes should let the runtime add multipart boundaries, while Node.js consumers of untrusted FormData#getHeaders() should prefer formDataHeaderPolicy content-only over the legacy all-header copy default.
  - id: timeout_required_by_application
    level: SHOULD
    statement: Applications should choose an explicit timeout for production requests; Axios does not establish one universal service deadline, and clarifyTimeoutError changes the timeout error code.
  - id: abortcontroller_preferred
    level: SHOULD
    statement: New code should use AbortController signals; CancelToken remains a deprecated compatibility API.
  - id: retry_cache_external
    level: MUST
    statement: Applications requiring retry, backoff, token refresh or caching must define and review those policies separately; retrying mutation-capable requests can duplicate remote effects, and no built-in cache behavior was established here.
  - id: progress_and_rate_limits
    level: MUST
    statement: Consumers must account for Node.js FormData upload progress being unsupported, Node.js redirected stream uploads potentially buffering the full stream, and maxRate applying only to the Node.js HTTP adapter.
  - id: http2_experimental
    level: MUST
    statement: Consumers enabling httpVersion 2 must treat HTTP/2 support as experimental and Node.js-only and must handle 3xx responses themselves because the HTTP/2 adapter does not follow redirects.
  - id: preview_not_runtime_proof
    level: MUST
    statement: This preview describes source-backed public behavior but makes no runtime, endpoint acceptance, publication, conformance or security guarantee.
effects:
  sideEffects:
    - id: outbound_request_data
      kind: network_write
      summary: With a built-in network adapter, Axios sends the configured method and destination plus query parameters, request headers, and any body to that destination; configured Authorization, Basic credentials, cookies, API keys and XSRF tokens are included when their request/runtime conditions enable them. A custom adapter may use a different destination or no network and requires separate effect review.
    - id: remote_mutation_request
      kind: network_write
      summary: POST, PUT, PATCH, DELETE or a caller-selected method can ask the configured remote service to mutate state while transmitting headers and body. Axios does not establish whether the server applies, stores or later retains the requested change, and this preview did not invoke an endpoint.
    - id: inbound_response_data
      kind: network_read
      summary: With a built-in network adapter, Axios receives remote status, headers and response data from the configured destination, subject to response type, transforms, limits, cancellation and transport errors.
    - id: progress_notifications
      kind: event_emit
      summary: When upload or download progress callbacks are configured and supported by the adapter, Axios emits transfer observations to caller code at a documented maximum frequency of three times per second.
    - id: client_configuration_state
      kind: state_mutation
      summary: Creating or changing instance defaults and registering, ejecting or clearing interceptors mutates local in-memory client configuration; it does not by itself prove a network call or remote mutation.
